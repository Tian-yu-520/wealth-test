<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>8 种财富体质 · 结果长图样张</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <style>
    body { background: #fdeef4; padding: 18px 14px 60px; }
    .ph { text-align: center; margin: 6px 0 18px; }
    .ph h1 { font-size: 20px; color: #ff2d6f; margin: 0 0 4px; }
    .ph p { font-size: 13px; color: #b0a0a8; margin: 0; }
    .sample { max-width: 440px; margin: 0 auto 22px; }
    .sample-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px; }
    .sample-head b { font-size: 15px; color: #2b2b2b; }
    .sample-head button { width: auto; padding: 7px 14px; font-size: 13px; border-radius: 10px; border: none; background: linear-gradient(135deg,#ff8fb3,#ff2d6f); color: #fff; font-weight: 600; cursor: pointer; }
    .result-card { margin: 0 auto; }
  </style>
</head>
<body>
  <div class="ph">
    <h1>8 种财富体质 · 结果长图样张</h1>
    <p>与真实测试结果页完全一致 · 点右侧「保存」可导出单张 PNG</p>
  </div>
  <div id="samples"></div>

  <script src="vendor/html2canvas.min.js?v=5"></script>
  <script src="data.js?v=5"></script>
  <script>
    // 每种人格的代表性六维分数（仅用于雷达图展示，文案取自 results）
    const SAMPLES = {
      hamster:    { d1: 4.6, d2: 1.8, d3: 1.6, d4: 3.0, d5: 3.8, d6: 2.6 },
      artist:     { d1: 1.8, d2: 4.4, d3: 3.0, d4: 3.6, d5: 2.2, d6: 3.2 },
      speculator: { d1: 2.2, d2: 3.4, d3: 4.6, d4: 3.2, d5: 2.4, d6: 3.6 },
      rentier:    { d1: 4.0, d2: 3.2, d3: 3.0, d4: 3.4, d5: 4.0, d6: 3.4 },
      machine:    { d1: 3.6, d2: 3.0, d3: 3.2, d4: 3.4, d5: 4.2, d6: 4.6 },
      snail:      { d1: 3.2, d2: 2.0, d3: 1.8, d4: 4.2, d5: 2.2, d6: 2.4 },
      leaker:     { d1: 2.8, d2: 4.0, d3: 3.0, d4: 4.0, d5: 2.6, d6: 3.0 },
      captain:    { d1: 4.4, d2: 2.6, d3: 3.2, d4: 3.6, d5: 4.6, d6: 4.4 }
    };
    const wrap = document.getElementById('samples');
    Object.keys(SAMPLES).forEach(type => {
      const t = TEST.results[type];
      const box = document.createElement('div');
      box.className = 'sample';
      box.innerHTML =
        '<div class="sample-head"><b>' + t.emoji + ' ' + t.name + '</b>' +
        '<button data-type="' + type + '">保存这张</button></div>' +
        '<div class="result-card" id="card-' + type + '">' + TEST.cardHTML({ type: type, scores: SAMPLES[type] }) + '</div>';
      wrap.appendChild(box);
    });
    wrap.querySelectorAll('button[data-type]').forEach(b => {
      b.onclick = async () => {
        const type = b.dataset.type, name = TEST.results[type].name;
        b.disabled = true; const txt = b.textContent; b.textContent = '生成中…';
        try {
          const canvas = await html2canvas(document.getElementById('card-' + type), {
            backgroundColor: '#FFF6E6', scale: Math.min(3, window.devicePixelRatio || 2), useCORS: true, logging: false
          });
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/png'); a.download = '财富体质_' + name + '.png';
          document.body.appendChild(a); a.click(); a.remove();
        } catch (e) { alert('生成失败，请重试'); }
        b.disabled = false; b.textContent = txt;
      };
    });
  </script>
</body>
</html>
